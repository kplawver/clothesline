name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # Best-effort x86_64 coverage until the formula is validated on real Intel hardware.
          - os: macos-15-intel
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned to the managed build rather than "3.12" so a runner's system Python
          # cannot change the interpreter under the suite.
          python-version: "cpython-3.12"
          cache-python: "true"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Claude Code plugin and marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/claude-code --strict
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Audit the generic .agents layout with Tallmadge
        run: |
          git clone --depth 1 https://github.com/kplawver/tallmadge.git /tmp/tallmadge
          cd /tmp/tallmadge
          bundle install --quiet
          bin/clpr repo check "$GITHUB_WORKSPACE"
      # The OMP extension and skill moved to kplawver/setauket with the capture
      # integrations; their syntax check lives in that repository's CI.
