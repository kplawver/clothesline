[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clothesline"
version = "0.7.0"
description = "Durable local messaging between coding agents"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2,<3",
  "starlette>=0.46,<2",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.16"]

[project.scripts]
clothesline = "clothesline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clothesline"]

[tool.pytest.ini_options]
testpaths = ["tests"]